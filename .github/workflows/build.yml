name: Build and push egobot image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: registry.gitlab.com/dario.tislar/hz1-images/egobot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry.gitlab.com
        uses: docker/login-action@v4
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

      - name: Compute immutable version tag
        id: vars
        run: |
          set -euo pipefail
          commit_ts=$(git show -s --format=%ct HEAD)
          short_sha=$(git rev-parse --short HEAD)
          version_tag="v$(date -u -d "@${commit_ts}" +%Y%m%d-%H%M%S)-${short_sha}"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./bot
          file: ./bot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version_tag }}
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed tag resolves
        run: |
          set -euo pipefail
          echo "Verifying ${IMAGE}:${VERSION_TAG} resolves in the registry..."
          if ! docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}"; then
            echo "::error::Image ${IMAGE}:${VERSION_TAG} does not resolve after push - registry push likely failed silently." >&2
            exit 1
          fi
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}

      - name: Write job summary
        run: |
          {
            echo "### egobot image published"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Version tag (use this in the cluster manifest): \`${VERSION_TAG}\`"
            echo "- Immutable SHA tag: \`sha-${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
